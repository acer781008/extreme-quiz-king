<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極速答題王－主控台</title><style>
*{box-sizing:border-box}
:root{--purple:#6353df;--ink:#27314c;--line:#dfe4f1;--soft:#f5f7ff}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:
linear-gradient(135deg,#4c35b8 0%,#7a52e6 36%,#1a9fd1 72%,#18b789 100%);background-attachment:fixed;position:relative;min-height:100vh}
body:before{content:"⚡   ⭐   ?   7   ABC   🏆   3   ❓   ★   9";position:fixed;inset:0;pointer-events:none;z-index:-1;color:#fff;font-weight:1000;font-size:clamp(34px,6vw,82px);letter-spacing:4vw;line-height:2.3;opacity:.18;transform:rotate(-8deg) scale(1.1)}

button,input,select,textarea{font:inherit}
.top{background:linear-gradient(120deg,#5144c7,#795fe7);color:#fff;min-height:58px;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 18px #4434a52b}
.top h1{font-size:21px;margin:0}.wrap{width:min(1200px,calc(100% - 18px));margin:9px auto}
.card{background:#fffffff5;backdrop-filter:blur(5px);border:1px solid var(--line);border-radius:16px;padding:11px;margin-bottom:8px;box-shadow:0 6px 18px #34406b0b}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:850;background:var(--purple);color:white;cursor:pointer;white-space:nowrap}
.btn.alt{background:#efefff;color:#4e479e}.btn.green{background:#168d57}.btn.orange{background:#e47c3e}.btn.red{background:#d65362}
.roombar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#eff1ff;font-weight:850}
.muted{color:#70798e;font-size:13px}.hidden{display:none!important}
.toast{position:fixed;right:16px;top:70px;z-index:99999;background:#27314c;color:#fff;border-radius:12px;padding:10px 14px;font-weight:850;box-shadow:0 8px 24px #0003;opacity:0;transform:translateY(-8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:#17213b8a;z-index:5000;display:flex;align-items:center;justify-content:center;padding:16px}.modalbox{width:min(520px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0004}.modalbox h2{margin-top:0}.modalbox hr{border:0;border-top:1px solid #e8ebf3}
.login{position:fixed;inset:0;background:linear-gradient(140deg,#eef1ff,#f8fbff);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.loginbox{width:min(400px,100%);background:#fff;border:1px solid var(--line);padding:20px;border-radius:20px;box-shadow:0 16px 45px #27314c20}.loginbox input{width:100%;padding:10px;border:1px solid #ccd4e5;border-radius:10px;margin:8px 0}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:7px 8px}.field label{display:block;font-size:12px;font-weight:900;margin:0 0 3px;color:#59627a}.field input,.field select{width:100%;height:35px;border:1px solid #ccd4e5;border-radius:9px;padding:5px 8px;background:white}.groupTitle{grid-column:1/-1;font-size:14px;font-weight:950;margin:3px 0 -1px;padding-top:3px;color:#4f46a7}.sectionTitle{font-size:19px;margin:0 0 9px}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:7px;border-bottom:1px solid #edf0f6;text-align:left}.roomActions{margin-top:7px;padding-top:7px;border-top:1px dashed #e0e5f0}@media(max-width:520px){.settings{grid-template-columns:1fr 1fr}.wrap{width:calc(100% - 10px)}.top h1{font-size:18px}.field input,.field select{height:37px}}.adminStatus{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}.statusClock{background:#29234fd9;color:white;border-radius:999px;padding:7px 11px;font-weight:950}</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2>🔐 主控登入</h2><input id="pw" type="password" placeholder="主控密碼"><button id="loginBtn" class="btn" style="width:100%">登入</button><p id="loginErr" class="muted"></p></div></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalBody"></div><button id="modalClose" class="btn" style="width:100%">關閉</button></div></div>
<header class="top"><h1>⚡ 極速答題王－主控台</h1><a class="btn alt" style="text-decoration:none" href="https://game-lobby-eo8o.onrender.com/">🏠 返回遊戲大廳</a></header>
<main class="wrap">
<section class="card"><div class="roombar"><button id="new" class="btn">＋ 新增房間</button><span id="room" class="pill">尚未建立房間</span><span id="topPlayers" class="pill">👥 目前玩家：0 位</span><button id="copyLink" class="btn alt">🔗 複製玩家連結</button><button id="copyText" class="btn alt">📋 複製分享文字</button></div><div class="roombar roomActions"><button id="start" class="btn green">▶ 開始遊戲</button><button id="end" class="btn orange">■ 結束遊戲</button><button id="del" class="btn red">🗑 刪除房間</button><span class="adminStatus"><span id="adminCountdown" class="statusClock hidden">⏱️ 開賽倒數 --</span><span id="adminGameTime" class="statusClock hidden">⏱️ 剩餘時間 --:--</span></span></div></section>

<section class="card"><h2 class="sectionTitle">⚙️ 遊戲設定</h2><div class="settings">
<div class="groupTitle">📚 題目</div>
<div class="field"><label>題庫大分類</label><select id="category"><option value="math">🔢 數學</option><option value="chinese">🀄 國文／文字</option><option value="classic">📜 國學／詩詞</option><option value="life">🌱 生活常識</option><option value="knowledge">🌏 地理／自然／知識</option><option value="fun">🧠 趣味題庫</option><option value="random">🎲 隨機混合題庫</option></select></div>
<div class="field"><label>小分類</label><select id="subcategory"></select></div>
<div class="field"><label>難度</label><select id="difficulty"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option><option value="random">隨機</option></select></div>
<div class="field"><label>每題倒數</label><select id="questionSeconds"></select></div>
<div class="field"><label>答題模式</label><select id="playMode"><option value="falling">🌠 飄落模式</option><option value="fixed">🔲 固定模式</option></select></div>
<div class="field" id="fixedCountBox"><label>固定答案數</label><select id="fixedAnswerCount"><option value="4">4 個</option><option value="6">6 個</option></select></div>
<div class="field" id="fallAnswerBox"><label>答案數量</label><select id="answerCount"><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div></div>
<div class="field" id="shapeBox"><label>答案形狀</label><select id="shape"><option value="star">⭐ 星星</option><option value="circle">● 圓形</option><option value="square">■ 方形</option><option value="diamond">◆ 菱形</option><option value="heart">♥ 愛心</option><option value="hex">⬡ 六邊形</option><option value="balloon">🎈 氣球</option><option value="cloud">☁ 雲朵</option><option value="mixed">🎲 綜合圖</option></select></div>
<div class="field"><label>掉落／飄動速度</label><select id="fallSpeed"><option value="slow">慢</option><option value="medium" selected>中</option><option value="fast">快</option></select></div>
<div class="field"><label>遊戲背景</label><select id="bg"><option value="sky">🌤️ 藍天草地</option><option value="stars">🌌 星空夜晚</option><option value="forest">🌲 森林綠野</option><option value="ocean">🐠 海底世界</option><option value="candy">🍭 糖果樂園</option><option value="space">🚀 太空冒險</option></select></div>

<div class="groupTitle">💰 計分</div>
<div class="field"><label>答對加分</label><input id="correctPoints" type="number" value="10"></div>
<div class="field"><label>答錯扣分</label><input id="wrongPoints" type="number" value="-5"></div>
<div class="field"><label>時間到未作答</label><input id="timeoutPoints" type="number" value="-5"></div>
<div class="field"><label>答錯後</label><select id="wrongAction"><option value="continue">繼續本題</option><option value="next">立即下一題</option></select></div>

<div class="groupTitle">🏁 開賽／結束</div>
<div class="field"><label>開賽同步倒數</label><select id="startCountdown"><option>10</option><option>20</option><option>30</option><option>40</option><option>50</option><option>60</option></select></div>
<div class="field"><label>滿幾人自動開賽</label><select id="autoStartPlayers"><option value="0">關閉</option><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option><option value="5">5 人</option><option value="6">6 人</option><option value="7">7 人</option><option value="8">8 人</option><option value="9">9 人</option><option value="10">10 人</option><option value="11">11 人</option><option value="12">12 人</option><option value="13">13 人</option><option value="14">14 人</option><option value="15">15 人</option><option value="16">16 人</option><option value="17">17 人</option><option value="18">18 人</option><option value="19">19 人</option><option value="20">20 人</option><option value="21">21 人</option><option value="22">22 人</option><option value="23">23 人</option><option value="24">24 人</option><option value="25">25 人</option><option value="26">26 人</option><option value="27">27 人</option><option value="28">28 人</option><option value="29">29 人</option><option value="30">30 人</option><option value="31">31 人</option><option value="32">32 人</option><option value="33">33 人</option><option value="34">34 人</option><option value="35">35 人</option><option value="36">36 人</option><option value="37">37 人</option><option value="38">38 人</option><option value="39">39 人</option><option value="40">40 人</option><option value="41">41 人</option><option value="42">42 人</option><option value="43">43 人</option><option value="44">44 人</option><option value="45">45 人</option><option value="46">46 人</option><option value="47">47 人</option><option value="48">48 人</option><option value="49">49 人</option><option value="50">50 人</option></select></div>
<div class="field"><label>完成條件</label><select id="finishMode"><option value="time">時間到結束</option><option value="target">指定答對題數</option><option value="first">第一位完成</option></select></div>
<div class="field" id="durationBox"><label>遊戲時間（分鐘）</label><select id="duration"><option>3</option><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option><option>45</option><option>60</option></select></div>
<div class="field hidden" id="targetBox"><label>指定答對題數</label><input id="targetCorrect" type="number" value="20" min="1"></div>
<div class="field"><label>📅 開賽日期＋時間（選填）</label><input id="startAt" type="datetime-local"></div>
<div class="field"><label>備註</label><input id="note" placeholder="選填"></div>
</div>
<div class="roombar" style="margin-top:10px"><button id="save" class="btn">💾 儲存設定</button><button id="rules" class="btn alt">📖 規則／分數預覽</button></div></section>

<section class="card"><div class="roombar"><h2 class="sectionTitle">🏆 即時排行榜 <span id="count" class="muted">0人</span></h2><span style="flex:1"></span><button id="copyRank" class="btn alt">📋 複製排行榜</button></div><div style="overflow:auto"><table class="rank"><thead><tr><th>排名</th><th>玩家</th><th>答對</th><th>答錯</th><th>未作答</th><th>分數</th></tr></thead><tbody id="rank"></tbody></table></div></section>
</main>
<script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id);let code="",roomData=null,adminToken=sessionStorage.getItem("eq_admin_token")||"";
const subs={math:[["mixed","四則混合"],["add","加法"],["sub","減法"],["mul","乘法"],["div","除法"],["nine","九九乘法"],["compare","大小比較"],["sequence","數列"]],chinese:[["mixed","綜合"],["idiom","成語填空"],["meaning","成語意思"],["typo","找錯字"],["pronounce","國字／注音"],["homophone","同音字"],["opposite","反義詞"],["similar","近義詞"],["measure","量詞"]],classic:[["mixed","綜合"],["three","三字經"],["tang","唐詩"],["poem","古詩詞"],["saying","成語／熟語接句"],["dizi","弟子規"]],life:[["mixed","綜合"],["food","食物／蔬果"],["animal","動物"],["weather","天氣"],["daily","日常用品"],["job","職業"],["festival","節日"],["eco","環保"],["traffic","交通安全"]],knowledge:[["mixed","綜合"],["taiwan","台灣地理"],["world","世界地理"],["capital","國家首都"],["science","自然科學"],["solar","太陽系"],["biology","動植物"],["history","歷史基礎"]],fun:[["mixed","綜合"],["riddle","猜謎"],["brain","腦筋急轉彎"],["odd","找不同類"],["emoji","Emoji猜題"]],random:[["mixed","全部隨機"]]};
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),2200)}
function modal(html){$("modalBody").innerHTML=html;$("modal").classList.remove("hidden")}$("modalClose").onclick=()=>$("modal").classList.add("hidden");
function fillSubs(){const a=subs[$("category").value]||subs.random;$("subcategory").innerHTML=a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}$("category").onchange=fillSubs;fillSubs();
for(let i=3;i<=30;i++)$("questionSeconds").insertAdjacentHTML("beforeend",`<option ${i===15?"selected":""}>${i}</option>`);
function finishFields(){const m=$("finishMode").value;$("durationBox").classList.toggle("hidden",m!=="time");$("targetBox").classList.toggle("hidden",m==="time")}$("finishMode").onchange=finishFields;finishFields();
function vals(){const o={};["category","subcategory","difficulty","playMode","fixedAnswerCount","questionSeconds","answerCount","shape","fallSpeed","bg","correctPoints","wrongPoints","timeoutPoints","wrongAction","startCountdown","autoStartPlayers","finishMode","duration","targetCorrect","startAt","note"].forEach(k=>o[k]=$(k).value);return o}
function render(r){roomData=r;$("count").textContent=r.count+"人";$("topPlayers").textContent=`👥 目前玩家：${r.count} 位`;$("rank").innerHTML=r.ranking.map((p,i)=>`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.correct}</td><td>${p.wrong}</td><td>${p.timeout}</td><td><b>${p.score}</b></td></tr>`).join("")}
async function login(){const r=await fetch("/api/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})}),j=await r.json();if(!j.ok){$("loginErr").textContent=j.message;return}adminToken=j.token;sessionStorage.setItem("eq_admin_token",adminToken);$("login").classList.add("hidden");toast("✅ 已登入主控台")}
$("loginBtn").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};if(adminToken)$("login").classList.add("hidden");
$("new").onclick=()=>s.emit("admin:create",{adminToken},x=>{if(!x.ok)return toast("❌ "+x.msg);code=x.code;$("room").textContent="房號："+code;render(x.room);toast("✅ 房間已建立")});
$("save").onclick=()=>{if(!code)return toast("⚠️ 請先新增房間");s.emit("admin:save",{code,settings:vals(),adminToken},x=>toast(x.ok?"✅ 設定已儲存":"❌ "+(x.msg||"儲存失敗")))};
$("start").onclick=()=>{if(!code)return toast("⚠️ 請先新增房間");s.emit("admin:start",{code,adminToken},x=>toast(x.ok?`⏱️ 已開始 ${x.seconds} 秒同步倒數`:"❌ "+x.msg))};
$("end").onclick=()=>{if(!code)return toast("⚠️ 請先新增房間");s.emit("admin:end",{code,adminToken},x=>toast(x.ok?"⏹️ 遊戲已結束":"❌ "+x.msg))};
$("del").onclick=()=>{if(code&&confirm("確定刪除房間？玩家及排行榜資料都會刪除。"))s.emit("admin:delete",{code,adminToken},x=>{if(x.ok){toast("🗑️ 房間已刪除");setTimeout(()=>location.reload(),450)}})};
$("copyLink").onclick=async()=>{if(!code)return toast("⚠️ 請先新增房間");await navigator.clipboard.writeText(location.origin+"/?room="+code);toast("✅ 玩家連結已複製")};
$("copyText").onclick=async()=>{if(!code)return toast("⚠️ 請先新增房間");let v=vals(),lines=[
`玩家連結：${location.origin}/?room=${code}`,
"⚡ 極速答題王",
`房號：${code}`,
`題庫：${$("category").selectedOptions[0].textContent}／${$("subcategory").selectedOptions[0].textContent}`,
`難度：${$("difficulty").selectedOptions[0].textContent}`,
`答題模式：${v.playMode==="fixed"?"固定模式（"+v.fixedAnswerCount+"個答案）":"飄落模式"}`,
`每題倒數：${v.questionSeconds}秒`,
`開賽倒數：${v.startCountdown}秒`,
"分數制"
];if(+v.autoStartPlayers>0)lines.push(`滿 ${v.autoStartPlayers} 人自動開賽`);if(v.finishMode==="time")lines.push(`遊戲時間：${v.duration}分鐘`);else lines.push(`完成條件：${v.finishMode==="target"?"答對"+v.targetCorrect+"題":"第一位答對"+v.targetCorrect+"題"}`);if(v.startAt)lines.push(`預定開賽：${v.startAt}`);if(v.note)lines.push(`備註：${v.note}`);await navigator.clipboard.writeText(lines.join("\n"));toast("✅ 分享文字已複製")};
$("copyRank").onclick=async()=>{if(!roomData)return toast("⚠️ 尚無排行榜");await navigator.clipboard.writeText(roomData.ranking.map((p,i)=>`排名${i+1}　答對${p.correct}　答錯${p.wrong}　未作答${p.timeout}　玩家：${p.name}`).join("\n"));toast("✅ 排行榜已複製")};
$("rules").onclick=()=>{let v=vals(),finish=v.finishMode==="time"?`遊戲 ${v.duration} 分鐘，時間到結束。`:v.finishMode==="target"?`答對 ${v.targetCorrect} 題即完成。`:`第一位答對 ${v.targetCorrect} 題時結束。`;modal(`<h2>📖 遊戲規則／分數</h2><p>題庫：<b>${$("category").selectedOptions[0].textContent}／${$("subcategory").selectedOptions[0].textContent}</b></p><p>開賽前所有玩家同步倒數 <b>${v.startCountdown} 秒</b>；正式開始後，每題限時 <b>${v.questionSeconds} 秒</b>。</p><p>直接點擊畫面中飄動的正確答案。答錯後：<b>${v.wrongAction==="continue"?"錯誤答案爆掉並補新答案，繼續本題":"立即換下一題"}</b>。</p><p>${finish}</p><hr><p>✅ 答對：<b>${Number(v.correctPoints)>=0?"+":""}${v.correctPoints} 分</b><br>💥 答錯：<b>${v.wrongPoints} 分</b><br>⏰ 未作答：<b>${v.timeoutPoints} 分</b></p>`)};
s.on("room:update",render);s.on("room:deleted",()=>{code="";$("room").textContent="尚未建立房間"});


function modeFields(){
 const fixed=$("playMode").value==="fixed";
 $("fixedCountBox").classList.toggle("hidden",!fixed);
 $("fallAnswerBox").classList.toggle("hidden",fixed);
 $("shapeBox").classList.toggle("hidden",fixed);
 $("speedBox").classList.toggle("hidden",fixed);
}
$("playMode").onchange=modeFields;modeFields();

let adminTimer=setInterval(()=>{
  if(!roomData)return;
  const cd=$("adminCountdown"),gt=$("adminGameTime");
  if(roomData.status==="countdown"&&roomData.countdownEndsAt){
    const left=Math.max(0,Math.ceil((roomData.countdownEndsAt-Date.now())/1000));
    cd.classList.remove("hidden");cd.textContent=left>0?`⏱️ 開賽倒數 ${left} 秒`:"🚀 GO！";
  }else cd.classList.add("hidden");
  if(roomData.status==="playing"&&roomData.endsAt&&roomData.settings.finishMode==="time"){
    const sec=Math.max(0,Math.ceil((roomData.endsAt-Date.now())/1000));
    gt.classList.remove("hidden");gt.textContent=`⏱️ 剩餘時間 ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
  }else gt.classList.add("hidden");
},250);
</script></body></html>
