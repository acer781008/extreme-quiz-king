<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極速答題王</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f2f5ff;color:#27314c}button,input,select,textarea{font:inherit}.top{background:linear-gradient(120deg,#584bd8,#765ce9);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:21px}.wrap{max-width:1180px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #e1e5f2;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 5px 18px #39406a0d}.roombar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:9px 13px;font-weight:800;background:#6254dd;color:#fff;cursor:pointer}.btn.alt{background:#eff0ff;color:#4c45a5}.btn.green{background:#168d57}.btn.red{background:#d65362}.pill{padding:7px 11px;border-radius:999px;background:#f0f1ff;font-weight:900}.settings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}.field label{display:block;font-size:12px;font-weight:900;margin:0 0 3px;color:#555f7b}.field input,.field select,.field textarea{width:100%;height:38px;border:1px solid #ccd4e5;border-radius:10px;padding:7px 9px;background:#fff}.field textarea{height:38px;resize:vertical}.sectionTitle{margin:0 0 10px;font-size:20px}.themes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.theme{border:2px solid transparent;border-radius:12px;padding:8px 4px;text-align:center;background:#f5f7fc;cursor:pointer;font-weight:800;font-size:12px}.theme.on{border-color:#6254dd;background:#efedff}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:8px;border-bottom:1px solid #edf0f6;text-align:left}.muted{font-size:13px;color:#727b92}.toast{position:fixed;right:18px;top:70px;z-index:99999;background:#27314c;color:white;border-radius:13px;padding:11px 15px;font-weight:900;box-shadow:0 8px 25px #0003;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.login{position:fixed;inset:0;background:#eef2ff;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(410px,100%);background:white;padding:22px;border-radius:22px;box-shadow:0 14px 40px #27314c20}.loginbox input{width:100%;padding:11px;border:1px solid #ccd4e5;border-radius:11px;margin:8px 0}.hidden{display:none!important}@media(max-width:850px){.settings{grid-template-columns:repeat(2,1fr)}.themes{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.settings{grid-template-columns:1fr 1fr}.wrap{padding:8px}.top{padding:10px}.top h1{font-size:18px}.roombar .btn{flex:1}.themes{grid-template-columns:repeat(3,1fr)}}
.player{max-width:900px;margin:auto}.joinbox{max-width:480px;margin:40px auto}.joinbox input{width:100%;height:44px;border:1px solid #ccd4e5;border-radius:11px;padding:10px}.game{height:min(68vh,650px);min-height:500px;position:relative;overflow:hidden;border-radius:20px;border:1px solid #d7ddec;background:#cfefff}.game:before,.game:after{content:"";position:absolute;pointer-events:none;opacity:.22;font-size:70px}.game:before{left:12px;bottom:20px}.game:after{right:12px;top:120px}.game[data-bg=sky]{background:linear-gradient(#bfe9ff,#e8f6cf)}.game[data-bg=sky]:before{content:"🌼🌿"}.game[data-bg=sky]:after{content:"☁️"}.game[data-bg=stars]{background:linear-gradient(#192653,#3c3970);color:white}.game[data-bg=stars]:before{content:"✨⭐"}.game[data-bg=stars]:after{content:"🌙"}.game[data-bg=forest]{background:linear-gradient(#cdeccf,#8dc9a0)}.game[data-bg=forest]:before{content:"🌿🍃"}.game[data-bg=forest]:after{content:"🌳"}.game[data-bg=ocean]{background:linear-gradient(#bdeeff,#75c9e9)}.game[data-bg=ocean]:before{content:"🌿🐚"}.game[data-bg=ocean]:after{content:"🐠🫧"}.game[data-bg=candy]{background:linear-gradient(#ffe1f0,#fff0c7)}.game[data-bg=candy]:before{content:"🍬🍭"}.game[data-bg=candy]:after{content:"🧁"}.game[data-bg=space]{background:linear-gradient(#171b43,#43336b);color:white}.game[data-bg=space]:before{content:"🪐✨"}.game[data-bg=space]:after{content:"🚀"}.question{position:relative;z-index:5;margin:10px;background:#fffffff0;color:#27314c;border-radius:16px;padding:12px;text-align:center;font-size:clamp(21px,5vw,34px);font-weight:1000;box-shadow:0 4px 14px #0001}.hud{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:7px}.drop{position:absolute;z-index:4;top:105px;min-width:70px;max-width:145px;min-height:58px;padding:9px;border:3px solid #fff;border-radius:24px;background:#ffdb62;color:#27314c;box-shadow:0 4px 12px #0002;font-weight:1000;font-size:clamp(16px,4vw,22px);overflow-wrap:anywhere}.drop.long{max-width:130px;min-height:75px;border-radius:17px}.overlay{position:absolute;inset:0;z-index:30;background:#26304cdd;color:white;display:flex;align-items:center;justify-content:center;font-size:65px;font-weight:1000}.waitgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.waititem{background:#f5f6ff;border-radius:12px;padding:9px;font-weight:800}@media(max-width:520px){.joinbox{margin:15px auto}.game{min-height:520px}.drop{max-width:112px;font-size:16px}.waitgrid{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="top"><h1>⚡ 極速答題王</h1><button id="info" class="btn alt">ⓘ 規則／分數</button></header><main class="wrap player">
<section id="join" class="card joinbox"><h2>🎮 加入遊戲</h2><p id="roomLabel" class="pill"></p><p class="muted">輸入你的玩家名稱後加入等待室。</p><input id="name" maxlength="20" placeholder="玩家名稱"><button id="joinBtn" class="btn" style="width:100%;margin-top:10px">加入遊戲</button><p id="joinMsg" style="font-weight:800"></p></section>
<section id="wait" class="card hidden"><h2>⏳ 等待比賽開始</h2><div class="waitgrid"><div class="waititem" id="wName"></div><div class="waititem" id="wCount"></div><div class="waititem" id="wCat"></div><div class="waititem" id="wDiff"></div><div class="waititem" id="wFinish"></div><div class="waititem" id="wTime"></div></div><p id="wNote"></p><div class="roombar"><button id="waitRules" class="btn alt">📖 規則說明</button><button id="waitScore" class="btn alt">💰 分數說明</button></div></section>
<section id="play" class="hidden"><div class="hud"><span id="gameTime" class="pill">比賽 --:--</span><span id="qTime" class="pill">本題 --</span><span id="myRank" class="pill">🏆 --</span><span id="score" class="pill">⭐ 0分</span></div><div id="game" class="game" data-bg="sky"><div id="question" class="question"></div><div id="countdown" class="overlay hidden"></div></div><div class="card roombar"><b id="stats">答對0｜答錯0｜未作答0</b><span style="flex:1"></span><button id="showRank" class="btn alt">🏆 排行榜</button></div></section>
<section id="result" class="card hidden"><h2>🏆 比賽結果</h2><div id="myResult"></div><button id="fullRank" class="btn">查看完整排行榜</button></section></main>
<script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=x=>document.getElementById(x),code=new URLSearchParams(location.search).get("room")||"";let token=localStorage.getItem("eq_"+code)||"",room=null,me=null,qInt=null,raf=null,answered=false,current=null;
$("roomLabel").textContent=code?"房號："+code:"⚠️ 玩家連結缺少房號";if(!code)$("joinBtn").disabled=true;
const catName={math:"🔢 數學",chinese:"🀄 國文／文字",classic:"📜 國學／詩詞",life:"🌱 生活常識",knowledge:"🌏 地理／自然／知識",fun:"🧠 趣味題庫",random:"🎲 隨機混合"},diffName={easy:"簡單",normal:"普通",hard:"困難",random:"隨機"};
const banks={chinese:[["畫蛇添＿","足",["手","尾","頭","花","眼"]],["「開心」的近義詞？","快樂",["難過","生氣","害怕","安靜","疲累"]]],classic:[["「床前明月光」下一句？","疑是地上霜",["舉頭望明月","低頭思故鄉","春眠不覺曉","處處聞啼鳥"]],["人之初，下一句？","性本善",["習相遠","貴以專","性乃遷","教之道"]]],life:[["下雨天通常使用什麼遮雨？","雨傘",["湯匙","枕頭","尺","碗","鞋"]],["紅燈時應該？","停下等待",["快速通過","加速","閉眼走","倒著走"]]],knowledge:[["台灣最高的山是？","玉山",["阿里山","陽明山","合歡山","雪山"]],["地球繞著什麼運行？","太陽",["月球","火星","木星","北極星"]]],fun:[["🐶 代表哪種動物？","狗",["貓","兔子","老虎","熊"]],["哪一個是交通工具？","公車",["鉛筆","杯子","枕頭","書本"]]]};
function mathQ(){let a=Math.ceil(Math.random()*20),b=Math.ceil(Math.random()*15),op=["+","-","×"][Math.floor(Math.random()*3)],ans;if(op==="+")ans=a+b;else if(op==="-"){if(b>a)[a,b]=[b,a];ans=a-b}else{a=Math.ceil(Math.random()*9);b=Math.ceil(Math.random()*9);ans=a*b}let w=new Set;while(w.size<7){let x=ans+Math.floor(Math.random()*17)-8;if(x>=0&&x!==ans)w.add(String(x))}return[`${a} ${op} ${b} = ?`,String(ans),[...w]]}
function getQ(){let c=room.settings.category;if(c==="random")c=["math","chinese","classic","life","knowledge","fun"][Math.floor(Math.random()*6)];if(c==="math")return mathQ();let a=banks[c]||banks.life;return a[Math.floor(Math.random()*a.length)]}
function join(){let name=$("name").value.trim();if(!token&&!name){$("joinMsg").textContent="⚠️ 請輸入玩家名稱";return}$("joinMsg").textContent="正在加入…";s.emit("player:join",{code,name,token},x=>{if(!x||!x.ok){$("joinMsg").textContent="❌ "+(x?.msg||"加入失敗，請再試一次");return}token=x.token;localStorage.setItem("eq_"+code,token);me=x.player;room=x.room;$("join").classList.add("hidden");if(room.status==="playing")startUI();else waitUI()})}
$("joinBtn").onclick=join;$("name").onkeydown=e=>{if(e.key==="Enter")join()};if(token)join();
function waitUI(){$("wait").classList.remove("hidden");updateWait()}
function updateWait(){if(!room||!me)return;$("wName").textContent="👤 "+me.name;$("wCount").textContent="👥 目前 "+room.count+" 人";$("wCat").textContent="📚 "+(catName[room.settings.category]||"題庫");$("wDiff").textContent="🎯 "+(diffName[room.settings.difficulty]||"普通");$("wFinish").textContent="🏁 "+(room.settings.finishMode==="time"?"時間到結束":room.settings.finishMode==="target"?"指定答對題數":"第一位完成");$("wTime").textContent=room.settings.finishMode==="time"?`⏱️ ${room.settings.duration}分鐘`:`✅ ${room.settings.targetCorrect}題`;$("wNote").textContent=room.settings.note?"📝 "+room.settings.note:""}
function info(){if(!room)return;let v=room.settings;alert(`題庫：${catName[v.category]||"隨機"}\n規則：看題目並直接點擊掉落的正確答案。\n答錯後：${v.wrongAction==="continue"?"繼續本題":"立即下一題"}\n每題：${v.questionSeconds}秒\n\n答對：+${v.correctPoints}分\n答錯：${v.wrongPoints}分\n未作答：${v.timeoutPoints}分`)}$("info").onclick=info;$("waitRules").onclick=info;$("waitScore").onclick=info;
s.on("room:update",r=>{room=r;if(me){let p=r.ranking.find(x=>x.name===me.name);if(p)me={...me,...p};updateWait();renderMe()}});
s.on("game:countdown",()=>{$("wait").classList.add("hidden");$("play").classList.remove("hidden");let n=3;$("countdown").classList.remove("hidden");$("countdown").textContent=n;let t=setInterval(()=>{n--;$("countdown").textContent=n>0?n:n===0?"GO！":"";if(n<0){clearInterval(t);$("countdown").classList.add("hidden")}},700)});
s.on("game:start",r=>{room=r;startUI()});s.on("game:ended",x=>showResult(x.ranking));s.on("room:deleted",()=>{alert("主控已刪除此房間");localStorage.removeItem("eq_"+code);location.href=location.pathname});
function startUI(){$("join").classList.add("hidden");$("wait").classList.add("hidden");$("play").classList.remove("hidden");$("game").dataset.bg=room.settings.bg||"sky";nextQ();renderMe()}
function renderMe(){if(!room||!me)return;let i=room.ranking.findIndex(x=>x.name===me.name);$("myRank").textContent="🏆 第"+(i+1)+"名";$("score").textContent="⭐ "+me.score+"分";$("stats").textContent=`答對${me.correct}｜答錯${me.wrong}｜未作答${me.timeout}`}
setInterval(()=>{if(room?.status==="playing"){let sec=room.endsAt?Math.max(0,Math.ceil((room.endsAt-Date.now())/1000)):0;$("gameTime").textContent=room.endsAt?`比賽 ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`:"比賽進行中"}},500);
function nextQ(){clearInterval(qInt);cancelAnimationFrame(raf);document.querySelectorAll(".drop").forEach(x=>x.remove());answered=false;current=getQ();$("question").textContent=current[0];let n=+room.settings.answerCount||6;if(current[1].length>6)n=Math.min(n,4);let arr=[current[1],...current[2].slice(0,n-1)].sort(()=>Math.random()-.5);arr.forEach((t,i)=>spawn(t,t===current[1],i,n));let left=+room.settings.questionSeconds||15;$("qTime").textContent=`本題 ${left}秒`;qInt=setInterval(()=>{left--;$("qTime").textContent=`本題 ${left}秒`;if(left<=0){clearInterval(qInt);if(!answered){answered=true;s.emit("answer:result",{code,token,type:"timeout"},()=>setTimeout(nextQ,400))}}},1000)}
function spawn(txt,correct,i,n){let d=document.createElement("button");d.className="drop"+(txt.length>6?" long":"");d.textContent=txt;$("game").appendChild(d);let g=$("game"),safe=8,w=d.offsetWidth,max=Math.max(safe,g.clientWidth-w-safe),lane=(i+.5)/n,x=Math.max(safe,Math.min(max,lane*g.clientWidth-w/2+(Math.random()-.5)*18));d.style.left=x+"px";let y=105,spd=room.settings.fallSpeed==="fast"?.9:room.settings.fallSpeed==="slow"?.35:.6;function f(){if(!d.isConnected)return;y+=spd;d.style.top=y+"px";if(y<g.clientHeight-d.offsetHeight-8)raf=requestAnimationFrame(f);else d.remove()}f();d.onclick=()=>{if(answered)return;if(correct){answered=true;clearInterval(qInt);s.emit("answer:result",{code,token,type:"correct"},x=>{if(x?.ok){me=x.player;renderMe();setTimeout(nextQ,250)}})}else{s.emit("answer:result",{code,token,type:"wrong"},x=>{if(x?.ok){me=x.player;renderMe();d.textContent="💥";setTimeout(()=>d.remove(),180);if(room.settings.wrongAction==="next"){answered=true;clearInterval(qInt);setTimeout(nextQ,250)}}})}}}
function showResult(rank){clearInterval(qInt);cancelAnimationFrame(raf);$("play").classList.add("hidden");$("result").classList.remove("hidden");let i=rank.findIndex(x=>x.name===me.name),p=rank[i];$("myResult").innerHTML=`<h2>第 ${i+1} 名｜${p.name}</h2><p>✅ ${p.correct}題　❌ ${p.wrong}題　⏰ ${p.timeout}題</p><h2>⭐ ${p.score}分</h2>`;$("fullRank").onclick=()=>alert(rank.map((p,i)=>`第${i+1}名｜${p.name}｜${p.score}分`).join("\n"))}$("showRank").onclick=()=>room&&alert(room.ranking.map((p,i)=>`第${i+1}名｜${p.name}｜${p.score}分`).join("\n"));
</script></body></html>
