<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極速答題王</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#25304a;background:#eef6ff}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#26365e;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:20px;margin:0}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d9e4f2;border-radius:18px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:#5a63e8;color:white}.btn.alt{background:#eef0ff;color:#4048ad}.btn.danger{background:#d95362}.btn.green{background:#168b52}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #cad7e7;border-radius:10px;padding:9px;background:white}.muted{color:#6b7690;font-size:13px}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:8px;border-bottom:1px solid #e5ebf4;text-align:left}.pill{padding:5px 9px;border-radius:999px;background:#eef1ff;font-weight:800;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:9px}.top{padding:10px}.rank{font-size:13px}}

.game{position:relative;overflow:hidden;min-height:520px;border-radius:20px;background:linear-gradient(#bfeaff,#e7f7c5);border:1px solid #cadbea}.question{position:relative;z-index:5;margin:10px;background:#fffffff2;border-radius:16px;padding:12px;text-align:center;font-weight:900;font-size:clamp(21px,5vw,34px)}.hud{display:flex;justify-content:space-around;gap:6px;flex-wrap:wrap;padding:8px}.drop{position:absolute;top:120px;min-width:72px;max-width:150px;min-height:58px;padding:10px;border:3px solid #fff;border-radius:22px;background:#ffdd67;box-shadow:0 3px 10px #0003;font-weight:900;font-size:clamp(16px,4vw,23px);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;overflow-wrap:anywhere;z-index:2}.long{border-radius:18px;max-width:132px;min-height:76px}.overlay{position:absolute;inset:0;z-index:20;background:#1e2b4ddd;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:64px;font-weight:1000}.hidden{display:none!important}@media(max-width:650px){.game{min-height:560px}.question{font-size:24px}.drop{max-width:118px;font-size:17px}.hud{font-size:13px}}
</style></head><body><div class="top"><h1>⚡ 極速答題王</h1><button id="info" class="btn alt">ⓘ 規則／分數</button></div><div class="wrap">
<div id="join" class="card"><h2>加入遊戲</h2><p id="roomLabel" class="pill"></p><div class="field"><label>玩家名稱</label><input id="name" maxlength="20" placeholder="請輸入名稱"></div><button id="joinBtn" class="btn" style="margin-top:10px">加入遊戲</button><p id="joinMsg" class="muted"></p></div>
<div id="wait" class="card hidden"><h2>⏳ 等待比賽開始</h2><p id="waitText"></p><div class="row"><button id="waitRules" class="btn alt">📖 規則說明</button><button id="waitScore" class="btn alt">💰 分數說明</button></div><p id="note"></p></div>
<div id="play" class="hidden"><div class="hud"><span class="pill" id="gameTime">比賽 --:--</span><span class="pill" id="qTime">本題 --</span><span class="pill" id="myRank">🏆 --</span><span class="pill" id="score">⭐ 0分</span></div><div class="game" id="game"><div class="question" id="question"></div><div id="countdown" class="overlay hidden"></div></div><div class="card"><span id="stats">答對0｜答錯0｜未作答0</span> <button id="showRank" class="btn alt" style="width:auto">🏆 排行榜</button></div></div>
<div id="result" class="card hidden"><h2>🏆 比賽結束！</h2><div id="myResult"></div><button id="fullRank" class="btn">查看完整排行榜</button></div>
</div><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id),code=new URLSearchParams(location.search).get("room")||"";let token=localStorage.getItem("eq_"+code)||"",room=null,me=null,qTimer=null,fallRAF=null,current=null,answered=false;
$("roomLabel").textContent="房號："+(code||"無");const banks={
math:["math"],chinese:[["「開心」的近義詞？","快樂",["難過","生氣","害怕","安靜"]],["畫蛇添＿","足",["手","尾","頭","花"]],["守株待＿","兔",["鹿","羊","馬","鳥"]]],
classic:[["「床前明月光」下一句？","疑是地上霜",["舉頭望明月","低頭思故鄉","春眠不覺曉","處處聞啼鳥"]],["人之初，下一句？","性本善",["習相遠","貴以專","性乃遷","教之道"]],["教之道，下一句？","貴以專",["性本善","習相遠","性乃遷","擇鄰處"]]],
life:[["下雨天通常使用什麼遮雨？","雨傘",["湯匙","枕頭","尺","碗"]],["紅燈時應該？","停下等待",["快速通過","加速","閉眼走","倒著走"]]],
knowledge:[["台灣最高的山是？","玉山",["阿里山","陽明山","合歡山","雪山"]],["地球繞著什麼運行？","太陽",["月球","火星","木星","北極星"]],["太陽系最大的行星？","木星",["地球","火星","水星","金星"]]],
fun:[["🐶 代表哪種動物？","狗",["貓","兔子","老虎","熊"]],["哪一個是交通工具？","公車",["鉛筆","杯子","枕頭","書本"]]]
};
function mathQ(){let a=Math.ceil(Math.random()*30),b=Math.ceil(Math.random()*20),ops=["+","-","×"];let op=ops[Math.floor(Math.random()*ops.length)],ans;if(op==="+")ans=a+b;if(op==="-"){if(b>a)[a,b]=[b,a];ans=a-b}if(op==="×"){a=Math.ceil(Math.random()*9);b=Math.ceil(Math.random()*9);ans=a*b}let ds=new Set();while(ds.size<7){let x=ans+Math.floor(Math.random()*17)-8;if(x!==ans&&x>=0)ds.add(String(x))}return [`${a} ${op} ${b} = ?`,String(ans),[...ds]]}
function getQ(){if(room.settings.category==="math")return mathQ();let a=banks[room.settings.category]||banks.life;return a[Math.floor(Math.random()*a.length)]}
function join(){s.emit("player:join",{code,name:$("name").value,token},x=>{if(!x.ok){$("joinMsg").textContent=x.msg;return}token=x.token;localStorage.setItem("eq_"+code,token);me=x.player;room=x.room;$("join").classList.add("hidden");if(room.status==="playing")startUI();else waitUI()})}
$("joinBtn").onclick=join;if(token)join();
function waitUI(){$("wait").classList.remove("hidden");$("waitText").textContent=`玩家：${me.name}｜目前人數：${room.count}人｜等待主控開始…`;$("note").textContent=room.settings.note?("📝 "+room.settings.note):""}
function info(){if(!room)return;alert(`規則：直接點擊掉落的正確答案。\n答對：${room.settings.correctPoints}分\n答錯：${room.settings.wrongPoints}分\n時間到：${room.settings.timeoutPoints}分`)}
$("info").onclick=info;$("waitRules").onclick=info;$("waitScore").onclick=info;
s.on("room:update",r=>{room=r;if(me){let p=r.ranking.find(x=>x.name===me.name);if(p){me={...me,...p};renderMe()}}});
s.on("game:countdown",()=>{$("wait").classList.add("hidden");$("play").classList.remove("hidden");let n=3;$("countdown").classList.remove("hidden");$("countdown").textContent=n;let t=setInterval(()=>{n--;if(n>0)$("countdown").textContent=n;else if(n===0)$("countdown").textContent="GO！";else{clearInterval(t);$("countdown").classList.add("hidden")}},700)});
s.on("game:start",r=>{room=r;startUI()});s.on("game:ended",x=>showResult(x.ranking));s.on("room:deleted",()=>{alert("主控已刪除此房間");location.href=location.pathname});
function startUI(){$("join").classList.add("hidden");$("wait").classList.add("hidden");$("play").classList.remove("hidden");nextQ();tickGame()}
function renderMe(){if(!room||!me)return;let i=room.ranking.findIndex(x=>x.name===me.name);$("myRank").textContent="🏆 第"+(i+1)+"名";$("score").textContent="⭐ "+me.score+"分";$("stats").textContent=`答對${me.correct}｜答錯${me.wrong}｜未作答${me.timeout}`}
function tickGame(){setInterval(()=>{if(!room||room.status!=="playing")return;let sec=room.endsAt?Math.max(0,Math.ceil((room.endsAt-Date.now())/1000)):0;$("gameTime").textContent=room.endsAt?`比賽 ${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`:"比賽進行中"},500)}
function nextQ(){clearInterval(qTimer);cancelAnimationFrame(fallRAF);document.querySelectorAll(".drop").forEach(x=>x.remove());answered=false;current=getQ();$("question").textContent=current[0];let count=+room.settings.answerCount||((room.settings.category==="classic")?4:6);count=Math.max(3,Math.min(8,count));let arr=[current[1],...current[2].slice(0,count-1)].sort(()=>Math.random()-.5);arr.forEach((txt,i)=>spawn(txt,txt===current[1],i,arr.length));let left=+room.settings.questionSeconds||15;$("qTime").textContent="本題 "+left+"秒";qTimer=setInterval(()=>{left--;$("qTime").textContent="本題 "+left+"秒";if(left<=0){clearInterval(qTimer);if(!answered){answered=true;s.emit("answer:result",{code,token,type:"timeout"},()=>setTimeout(nextQ,500))}},1000)}
function spawn(txt,correct,i,n){let d=document.createElement("button");d.className="drop"+(txt.length>6?" long":"");d.textContent=txt;d.style.left="0";$("game").appendChild(d);let gw=$("game").clientWidth,w=d.offsetWidth,safe=8,max=Math.max(safe,gw-w-safe);let lane=(i+.5)/n;let x=Math.max(safe,Math.min(max,lane*gw-w/2+(Math.random()-.5)*28));d.style.left=x+"px";let y=125,speed=room.settings.fallSpeed==="fast"?.9:room.settings.fallSpeed==="slow"?.35:.6;function fall(){if(!d.isConnected)return;y+=speed;d.style.top=y+"px";if(y<$("game").clientHeight-d.offsetHeight-8)fallRAF=requestAnimationFrame(fall);else d.remove()}fall();d.onclick=()=>{if(answered)return;if(correct){answered=true;clearInterval(qTimer);s.emit("answer:result",{code,token,type:"correct"},x=>{if(x.ok){me=x.player;renderMe();setTimeout(nextQ,300)}})}else{s.emit("answer:result",{code,token,type:"wrong"},x=>{if(x.ok){me=x.player;renderMe();d.textContent="💥";setTimeout(()=>d.remove(),200);if(room.settings.wrongAction==="next"){answered=true;clearInterval(qTimer);setTimeout(nextQ,300)}}})}}}
function showResult(rank){clearInterval(qTimer);cancelAnimationFrame(fallRAF);$("play").classList.add("hidden");$("result").classList.remove("hidden");let i=rank.findIndex(x=>x.name===me.name),p=rank[i];$("myResult").innerHTML=`<h3>第 ${i+1} 名｜${p.name}</h3><p>✅ 答對 ${p.correct}題　❌ 答錯 ${p.wrong}題　⏰ 未作答 ${p.timeout}題</p><h2>⭐ ${p.score}分</h2>`;$("fullRank").onclick=()=>alert(rank.map((p,i)=>`第${i+1}名｜${p.name}｜${p.score}分`).join("\n"))}
$("showRank").onclick=()=>room&&alert(room.ranking.map((p,i)=>`第${i+1}名｜${p.name}｜${p.score}分`).join("\n"));
</script></body></html>
