function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mathQ(){let tries=0,q;do{let a=Math.ceil(Math.random()*20),b=Math.ceil(Math.random()*15),op=["+","-","×"][Math.floor(Math.random()*3)],ans;if(op==="+")ans=a+b;else if(op==="-"){if(b>a)[a,b]=[b,a];ans=a-b}else{a=Math.ceil(Math.random()*9);b=Math.ceil(Math.random()*9);ans=a*b}let w=new Set;while(w.size<9){let x=ans+Math.floor(Math.random()*21)-10;if(x>=0&&x!==ans)w.add(String(x))}q=[`${a} ${op} ${b} = ?`,String(ans),[...w]];tries++}while(lastMath.includes(q[0])&&tries<30);lastMath.push(q[0]);if(lastMath.length>12)lastMath.shift();return q}
function refillDeck(){let c=room.settings.category;if(c==="random"){deck=[];["chinese","classic","life","knowledge","fun"].forEach(k=>deck.push(...banks[k].map(q=>[k,q])));deck=shuffle(deck)}else if(c!=="math")deck=shuffle((banks[c]||banks.fun).map(q=>[c,q]));}
function getQ(){let c=room.settings.category;if(c==="math")return mathQ();if(!deck.length)refillDeck();return deck.pop()[1]}
function modalInfo(){if(!room)return;let v=room.settings,finish=v.finishMode==="time"?`遊戲 ${v.duration} 分鐘，時間到結束。`:v.finishMode==="target"?`答對 ${v.targetCorrect} 題即完成。`:`第一位答對 ${v.targetCorrect} 題時結束。`;document.getElementById("modalBody").innerHTML=`<h2>📖 遊戲規則／分數</h2><p>題庫：<b>${catName[v.category]||"題庫"}</b>　難度：<b>${diffName[v.difficulty]||"普通"}</b></p><p>開賽前全房同步倒數 <b>${v.startCountdown} 秒</b>。正式開始後，每題限時 <b>${v.questionSeconds} 秒</b>，直接點擊飄動的正確答案。</p><p>答錯後：<b>${v.wrongAction==="continue"?"錯誤答案爆掉並補新答案，繼續本題":"立即換下一題"}</b></p><p>${finish}</p><hr><p>✅ 答對：<b>${+v.correctPoints>=0?"+":""}${v.correctPoints} 分</b><br>💥 答錯：<b>${v.wrongPoints} 分</b><br>⏰ 未作答：<b>${v.timeoutPoints} 分</b></p>`;$("modal").classList.remove("hidden")}
$("modalClose").onclick=()=>$("modal").classList.add("hidden");$("waitInfo").onclick=modalInfo;$("playInfo").onclick=modalInfo;
function join(){let name=$("name").value.trim();if(!token&&!name){$("joinMsg").textContent="⚠️ 請輸入玩家名稱";return}$("joinMsg").textContent="正在加入…";s.emit("player:join",{code,name,token},x=>{if(!x?.ok){$("joinMsg").textContent="❌ "+(x?.msg||"加入失敗");return}token=x.token;localStorage.setItem("eq_"+code,token);me=x.player;room=x.room;$("join").classList.add("hidden");if(room.status==="countdown")showCountdown(room.countdownEndsAt);else if(room.status==="playing")startUI();else waitUI()})}
$("joinBtn").onclick=join;$("name").onkeydown=e=>{if(e.key==="Enter")join()};if(token)join();
function waitUI(){$("wait").classList.remove("hidden");updateWait()}
function updateWait(){if(!room||!me)return;$("wName").textContent="👤 "+me.name;$("wCount").textContent="👥 目前 "+room.count+" 人";$("wCat").textContent="📚 "+(catName[room.settings.category]||"題庫");$("wDiff").textContent="🎯 "+(diffName[room.settings.difficulty]||"普通");$("wFinish").textContent="🏁 "+(room.settings.finishMode==="time"?"時間到結束":room.settings.finishMode==="target"?"指定答對題數":"第一位完成");$("wTime").textContent=room.settings.finishMode==="time"?`⏱️ ${room.settings.duration}分鐘`:`✅ ${room.settings.targetCorrect}題`;$("wNote").textContent=room.settings.note?"📝 "+room.settings.note:""}
s.on("room:update",r=>{room=r;if(me){let p=r.ranking.find(x=>x.name===me.name);if(p)me={...me,...p};updateWait();renderMe()}});
s.on("game:countdown",x=>showCountdown(x.endsAt));
function showCountdown(endsAt){clearInterval(countInt);$("join").classList.add("hidden");$("wait").classList.add("hidden");$("play").classList.remove("hidden");$("game").dataset.bg=room?.settings?.bg||"sky";$("countdown").classList.remove("hidden");function tick(){let left=Math.max(0,Math.ceil((endsAt-Date.now())/1000));$("bigcount").textContent=left>0?left:"GO！";if(left<=0){clearInterval(countInt);setTimeout(()=>$("countdown").classList.add("hidden"),700)}}tick();countInt=setInterval(tick,250)}
s.on("game:start",r=>{room=r;$("countdown").classList.add("hidden");startUI()});
s.on("game:ended",x=>showResult(x.ranking));s.on("room:deleted",()=>{alert("主控已刪除此房間");localStorage.removeItem("eq_"+code);location.href=location.pathname});
function startUI(){$("join").classList.add("hidden");$("wait").classList.add("hidden");$("play").classList.remove("hidden");$("game").dataset.bg=room.settings.bg||"sky";deck=[];nextQ();renderMe()}
function renderMe(){if(!room||!me)return;let i=room.ranking.findIndex(x=>x.name===me.name);$("myRank").textContent="🏆 第"+(i+1)+"名";$("score").textContent="⭐ "+me.score+"分";$("stats").textContent=`答對${me.correct}｜答錯${me.wrong}｜未作答${me.timeout}`}
setInterval(()=>{if(room?.status==="playing"){let sec=room.endsAt?Math.max(0,Math.ceil((room.endsAt-Date.now())/1000)):0;$("gameTime").textContent=room.endsAt?`比賽 ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`:"比賽進行中"}},500);
function showFeedback(kind,text){const f=$("feedback");f.className="feedback "+kind;f.textContent=text;void f.offsetWidth;f.classList.add("show")}
function clearDrops(){spawnTimers.forEach(clearTimeout);spawnTimers=[];document.querySelectorAll(".drop").forEach(x=>x.remove())}
function nextQ(){clearInterval(qInt);clearDrops();answered=false;current=getQ();$("question").textContent=current[0];let n=+room.settings.answerCount||6;if(current[1].length>8)n=Math.min(n,4);else if(current[1].length>5)n=Math.min(n,6);let wrongs=shuffle(current[2]).slice(0,n-1),arr=shuffle([current[1],...wrongs]);arr.forEach((t,i)=>spawn(t,t===current[1],n,Math.random()*1400));let total=+room.settings.questionSeconds||15,left=total;$("qTime").textContent=`本題 ${left}秒`;$("timerbar").style.width="100%";$("timerbar").classList.remove("danger");qInt=setInterval(()=>{left=Math.max(0,left-0.2);let sec=Math.ceil(left);$("qTime").textContent=`本題 ${sec}秒`;$("timerbar").style.width=(left/total*100)+"%";$("timerbar").classList.toggle("danger",left<=5);if(left<=0){clearInterval(qInt);if(!answered){answered=true;clearDrops();showFeedback("time",`⏰ ${room.settings.timeoutPoints}`);s.emit("answer:result",{code,token,type:"timeout"},x=>{if(x?.ok){me=x.player;renderMe()}setTimeout(nextQ,700)})}}},200)}
const shapeList=["star","circle","square","diamond","heart","hex","balloon","cloud"];
function spawn(txt,correct,n,delay=0){let tm=setTimeout(()=>createDrop(txt,correct,n),delay);spawnTimers.push(tm)}
function createDrop(txt,correct,n){if(answered||room?.status!=="playing")return;let d=document.createElement("button"),shape=room.settings.shape||"star";if(shape==="mixed")shape=shapeList[Math.floor(Math.random()*shapeList.length)];d.className="drop"+(txt.length>6?" long":"");d.dataset.shape=shape;d.textContent=txt;$("game").appendChild(d);
let g=$("game"),w=d.offsetWidth,x=Math.random()*(g.clientWidth+w*.9)-w*.45,y=86-Math.random()*170;
let base=room.settings.fallSpeed==="fast"?4.2:room.settings.fallSpeed==="slow"?1.65:2.7,vy=base*(.65+Math.random()*.8),vx=(Math.random()-.5)*(room.settings.fallSpeed==="fast"?4.3:room.settings.fallSpeed==="slow"?1.8:3.0),phase=Math.random()*6.28,amp=12+Math.random()*42,freq=.018+Math.random()*.035,frame=0,dead=false,lock=false;
function replace(){if(dead)return;dead=true;d.remove();if(!answered&&room?.status==="playing")spawn(txt,correct,n,140+Math.random()*550)}
function fly(){if(dead||!d.isConnected)return;frame++;y+=vy;x+=vx;d.style.top=y+"px";d.style.left=(x+Math.sin(phase+frame*freq)*amp)+"px";let r=d.getBoundingClientRect(),gr=g.getBoundingClientRect();if(r.top>gr.bottom+70||r.right<gr.left-70||r.left>gr.right+70){replace();return}requestAnimationFrame(fly)}requestAnimationFrame(fly);
d.onclick=()=>{if(answered||lock)return;lock=true;if(correct){answered=true;clearInterval(qInt);showFeedback("good",`✅ +${room.settings.correctPoints}`);s.emit("answer:result",{code,token,type:"correct"},x=>{if(x?.ok){me=x.player;renderMe()}clearDrops();setTimeout(nextQ,650)})}else{showFeedback("bad",`💥 ${room.settings.wrongPoints}`);s.emit("answer:result",{code,token,type:"wrong"},x=>{if(x?.ok){me=x.player;renderMe();d.textContent="💥";if(room.settings.wrongAction==="next"){answered=true;clearInterval(qInt);setTimeout(()=>{clearDrops();nextQ()},650)}else setTimeout(replace,180)}})}}}
function showResult(rank){clearInterval(qInt);clearDrops();$("play").classList.add("hidden");$("result").classList.remove("hidden");let i=rank.findIndex(x=>x.name===me.name),p=rank[i];$("myResult").innerHTML=`<h2>第 ${i+1} 名｜${p.name}</h2><p>✅ ${p.correct}題　❌ ${p.wrong}題　⏰ ${p.timeout}題</p><h2>⭐ ${p.score}分</h2>`;$("fullRank").onclick=()=>alert(rank.map((p,i)=>`第${i+1}名｜${p.name}｜${p.score}分`).join("\\n"))}
$("showRank").onclick=()=>room&&alert(room.ranking.map((p,i)=>`第${i+1}名｜${p.name}｜${p.score}分`).join("\\n"));
</script></body></html>
