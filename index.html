 const answers=extraFacts[k].map(x=>x[1]);
 extraFacts[k].forEach(([q,a,customWrongs],idx)=>{
   const pool=customWrongs?.length
     ? [...new Set(customWrongs.filter(x=>x!==a))]
     : [...new Set([...answers.filter(x=>x!==a),...fallbackWrong])];
   banks[k].push([q,a,shuffle(pool).slice(0,9)]);
 });

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mathQ(){let tries=0,q;do{let a=Math.ceil(Math.random()*20),b=Math.ceil(Math.random()*15),op=["+","-","×"][Math.floor(Math.random()*3)],ans;if(op==="+")ans=a+b;else if(op==="-"){if(b>a)[a,b]=[b,a];ans=a-b}else{a=Math.ceil(Math.random()*9);b=Math.ceil(Math.random()*9);ans=a*b}let w=new Set;while(w.size<9){let x=ans+Math.floor(Math.random()*21)-10;if(x>=0&&x!==ans)w.add(String(x))}q=[`${a} ${op} ${b} = ?`,String(ans),[...w]];tries++}while(lastMath.includes(q[0])&&tries<30);lastMath.push(q[0]);if(lastMath.length>12)lastMath.shift();return q}

function startUI(){
  exhausted=false;$("join").classList.add("hidden");$("wait").classList.add("hidden");$("result").classList.add("hidden");
  $("play").classList.remove("hidden");$("game").dataset.bg=room.settings.bg||"sky";deck=[];nextQ();renderMe()
}
function renderMe(){
  if(!room||!me)return;
  let i=room.ranking.findIndex(x=>x.name===me.name);
  $("myRank").textContent=i>=0?"🏆 第"+(i+1)+"名":"🏆 --";
  $("score").textContent="⭐ "+(me.score||0)+"分";
  $("stats").textContent=`答對${me.correct||0}｜答錯${me.wrong||0}｜未作答${me.timeout||0}`
}
setInterval(()=>{
  if(room?.status==="playing"){
    let sec=room.endsAt?Math.max(0,Math.ceil((room.endsAt-Date.now())/1000)):0;
    $("gameTime").textContent=room.endsAt?`比賽 ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`:"比賽進行中";
    if(room.endsAt&&Date.now()>=room.endsAt){room.status="ended";showResult(room.ranking||[])}
  }else if(room?.status==="ended"){
    $("gameTime").textContent="🏁 已結束";
  }
},250);

function showFeedback(kind,text){
  const f=$("feedback");f.className="feedback "+kind;f.textContent=text;void f.offsetWidth;f.classList.add("show")
}
let phaseTimer=null;
function clearPhase(){clearInterval(qInt);qInt=null;clearInterval(phaseTimer);phaseTimer=null}
function clearDrops(){
  spawnTimers.forEach(clearTimeout);spawnTimers=[];
  respawnTimers.forEach(clearTimeout);respawnTimers=[];
  movers=[];
  document.querySelectorAll(".drop,.fixedAnswers").forEach(x=>x.remove())
}
function getAnswerSetup(){
  let fixed=room.settings.playMode==="fixed",n=fixed?(+room.settings.fixedAnswerCount||4):(+room.settings.answerCount||6);
  if(current[1].length>8)n=Math.min(n,4);else if(current[1].length>5)n=Math.min(n,6);
  let wrongs=shuffle(current[2]).slice(0,n-1);
  return {fixed,n,arr:shuffle([current[1],...wrongs])}
}
function runCountdown(seconds,label,onDone){
  let total=Math.max(0,+seconds||0),left=total;
  if(total<=0){onDone();return}
  $("qTime").textContent=`${label} ${Math.ceil(left)}秒`;
  $("timerbar").style.width="100%";$("timerbar").classList.remove("danger");
  phaseTimer=setInterval(()=>{
    if(room?.status!=="playing"){clearPhase();return}
    left=Math.max(0,left-.1);
    $("qTime").textContent=`${label} ${Math.ceil(left)}秒`;
    $("timerbar").style.width=(left/total*100)+"%";
    $("timerbar").classList.toggle("danger",label.includes("作答")&&left<=5);
    if(left<=0){clearInterval(phaseTimer);phaseTimer=null;onDone()}
  },100)
}
function nextQ(){
  clearPhase();clearDrops();answered=false;
  if(room?.status!=="playing")return;
  current=getQ();
  if(!current){$("question").textContent="🎉 本場題目已全部完成";$("qTime").textContent="題庫完成";$("timerbar").style.width="0%";return}
  $("question").textContent=current[0];
  const setup=getAnswerSetup(),readSec=+room.settings.readingSeconds||0;
  if(readSec>0){
    runCountdown(readSec,"👀 看題",()=>beginAnswerPhase(setup));
  }else{
    beginAnswerPhase(setup);
  }
}
function beginAnswerPhase(setup){
  if(answered||room?.status!=="playing")return;
  if(setup.fixed)renderFixed(setup.arr,current[1]);
  else{
    // 答案改為「不同時間陸續掉落」：
    // 第一顆很快出現，後面每顆再隨機間隔 0.4～1.2 秒，
    // 使用累積延遲，避免看起來像整排一起掉。
    const speedMode=room.settings.fallSpeed||"medium";
    const gap=speedMode==="slow"?[750,1450]:speedMode==="fast"?[240,620]:[430,950];
    let delay=100+Math.random()*180;
    setup.arr.forEach((t,i)=>{
      if(i>0)delay+=gap[0]+Math.random()*(gap[1]-gap[0]);
      spawn(t,t===current[1],setup.n,delay);
    });
  }
  let total=+room.settings.questionSeconds||15,left=total;
  $("qTime").textContent=`⏱️ 作答 ${Math.ceil(left)}秒`;$("timerbar").style.width="100%";$("timerbar").classList.remove("danger");
  qInt=setInterval(()=>{
    if(room?.status!=="playing"){clearPhase();clearDrops();return}
    left=Math.max(0,left-.1);
    $("qTime").textContent=`⏱️ 作答 ${Math.ceil(left)}秒`;
    $("timerbar").style.width=(left/total*100)+"%";
    $("timerbar").classList.toggle("danger",left<=5);
    if(left<=0){
      clearInterval(qInt);qInt=null;
      if(!answered){
        answered=true;clearDrops();showFeedback("time",`⏰ ${room.settings.timeoutPoints}`);
        s.emit("answer:result",{code,token,type:"timeout"},x=>{
          if(x?.ok){me=x.player;renderMe()}
          if(room?.status==="playing")setTimeout(nextQ,650)
        })
      }
    }
  },100)
}

const shapeList=["circle","square","round","diamond","hex","balloon","cloud"];
const dropColors=["#ffd45e","#ff9fba","#8fe3ff","#9fe6a0","#cdb4ff","#ffbe7b","#87e6d0","#f7a8ff"];
let movers=[],respawnTimers=[];
function renderFixed(arr,correctText){
  clearDrops();
  let box=document.createElement("div");box.className="fixedAnswers"+(arr.length===6?" six":"");box.id="fixedAnswers";
  const timer=$("timerbox")||document.querySelector(".timerbox");
  const top=(timer?timer.offsetTop+timer.offsetHeight+18:145);
  box.style.top=top+"px";
  arr.forEach((txt,i)=>{
    let b=document.createElement("button");b.className="fixedAnswer";b.style.background=dropColors[i%dropColors.length];
    b.textContent=txt;b.onclick=()=>handleAnswer(b,txt===correctText);box.appendChild(b)
  });
  $("game").appendChild(box);
}
function spawn(txt,correct,n,delay=0){
  let t=setTimeout(()=>createDrop(txt,correct,n),delay);spawnTimers.push(t)
}
function fallTop(){
  const g=$("game"),timer=g?.querySelector(".timerbox");
  return timer?timer.offsetTop+timer.offsetHeight+8:125
}
function chooseSpawnX(width){
  const g=$("game"),W=Math.max(0,g.clientWidth-width);
  let best=Math.random()*W,bestGap=-1;
  for(let k=0;k<18;k++){
    let x=Math.random()*W,gap=movers.length?Math.min(...movers.map(m=>Math.abs((m.x+m.w/2)-(x+width/2)))):9999;
    if(gap>bestGap){bestGap=gap;best=x}
    if(gap>width*.95)break
  }
  return best
}
function createDrop(txt,correct,n){
  if(answered||room?.status!=="playing"||room.settings.playMode==="fixed")return;
  const top=fallTop();
  // 上緣還很擠時稍微再等一下，避免兩顆答案像同時成排出現。
  if(movers.some(m=>m.y<top+55)){
    let t=setTimeout(()=>createDrop(txt,correct,n),180+Math.random()*260);
    respawnTimers.push(t);
    return;
  }
  let d=document.createElement("button"),shape=room.settings.shape||"circle";
  if(shape==="star"||shape==="heart")shape="circle";
  if(shape==="mixed")shape=shapeList[Math.floor(Math.random()*shapeList.length)];
  d.className="drop";if(txt.length>12)d.classList.add("tinyText");else if(txt.length>7)d.classList.add("smallText");
  d.dataset.shape=shape;d.textContent=txt;d.style.left="0";d.style.top="0";
  d.style.setProperty("--drop-color",dropColors[Math.floor(Math.random()*dropColors.length)]);
  $("game").appendChild(d);
  let w=d.offsetWidth,h=d.offsetHeight,x=chooseSpawnX(w),y=fallTop();
  const speedMode=room.settings.fallSpeed||"medium";
  const speed=speedMode==="fast"?1.85:speedMode==="slow"?.58:1.05;
  const swayBase=speedMode==="fast"?1.18:speedMode==="slow"?.58:.88;
  let m={
    el:d,x,y,w,h,txt,correct,n,
    vy:(.72+Math.random()*.42)*speed,
    vx:(Math.random()-.5)*(speedMode==="fast"?.58:speedMode==="slow"?.22:.4),
    phase:Math.random()*Math.PI*2,
    sway:(.35+Math.random()*.55)*swayBase,
    freq:(.012+Math.random()*.012)*(speedMode==="fast"?1.22:speedMode==="slow"?.82:1),
    drift:(Math.random()-.5)*(speedMode==="fast"?.022:speedMode==="slow"?.010:.017)
  };
  movers.push(m);d.onclick=()=>handleAnswer(d,correct);
  if(!window._physicsRAF)physics()
}
function scheduleReplacement(m){
  if(answered||room?.status!=="playing"||room.settings.playMode==="fixed")return;
  const sm=room.settings.fallSpeed||"medium";
  const wait=sm==="slow"?700+Math.random()*900:sm==="fast"?220+Math.random()*420:400+Math.random()*700;
  let t=setTimeout(()=>createDrop(m.txt,m.correct,m.n),wait);respawnTimers.push(t)
}
function handleAnswer(el,correct){
  if(answered||room?.status!=="playing")return;
  if(correct){
    answered=true;clearPhase();clearDrops();showFeedback("ok",`✅ +${room.settings.correctPoints}`);
    s.emit("answer:result",{code,token,type:"correct"},x=>{
      if(x?.ok){me=x.player;renderMe()}
      if(room?.status==="playing")setTimeout(nextQ,600)
    })
  }else{
    showFeedback("bad",`💥 ${room.settings.wrongPoints}`);
    s.emit("answer:result",{code,token,type:"wrong"},x=>{if(x?.ok){me=x.player;renderMe()}});
    if(room.settings.wrongAction==="next"){
      answered=true;clearPhase();clearDrops();setTimeout(()=>{if(room?.status==="playing")nextQ()},600)
    }else if(el.classList.contains("fixedAnswer")){
      el.disabled=true;el.style.opacity=".45"
    }else{
      let m=movers.find(m=>m.el===el);movers=movers.filter(x=>x.el!==el);el.remove();if(m)scheduleReplacement(m)
    }
  }
}
function physics(){
  window._physicsRAF=requestAnimationFrame(physics);
  const g=$("game");if(!g||room?.status!=="playing")return;
  const W=g.clientWidth,H=g.clientHeight,top=fallTop(),now=performance.now();
  for(let i=movers.length-1;i>=0;i--){
    let a=movers[i];if(!a.el.isConnected){movers.splice(i,1);continue}
    // Always progresses downward; irregularity is horizontal sway/drift only.
    a.y+=a.vy;
    a.vx+=Math.sin(now*a.freq+a.phase)*.018*a.sway+a.drift;
    a.vx*=.965;
    a.vx=Math.max(-1.35,Math.min(1.35,a.vx));
    a.x+=a.vx+Math.sin(now*.003+a.phase)*.22*a.sway;
    if(a.x<=0){a.x=0;a.vx=Math.abs(a.vx)*.7}
    if(a.x+a.w>=W){a.x=Math.max(0,W-a.w);a.vx=-Math.abs(a.vx)*.7}
    if(a.y<top)a.y=top;
    if(a.y+a.h>=H-3){
      movers.splice(i,1);a.el.remove();scheduleReplacement(a);continue
    }
    for(let j=i-1;j>=0;j--){
      let b=movers[j];if(!b?.el?.isConnected)continue;
      let acx=a.x+a.w/2,bcx=b.x+b.w/2,acy=a.y+a.h/2,bcy=b.y+b.h/2;
      let dx=acx-bcx,dy=acy-bcy,ox=(a.w+b.w)/2-Math.abs(dx),oy=(a.h+b.h)/2-Math.abs(dy);
      if(ox>0&&oy>0){
        // Visible bounce: separate horizontally and give opposite impulses.
        let dir=dx===0?(Math.random()<.5?-1:1):(dx>0?1:-1);
        let push=Math.min(18,ox/2+3);
        a.x+=dir*push;b.x-=dir*push;
        a.vx=dir*(1.15+Math.random()*.45);
        b.vx=-dir*(1.15+Math.random()*.45);
        // Never launch upward; only slightly separate vertically while continuing down.
        if(oy<10){a.y+=Math.max(1,oy/2);b.y-=Math.max(1,oy/2);b.y=Math.max(top,b.y)}
      }
    }
    a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`
  }
}
function rankHtml(ranking){
 const rows=(ranking||[]).map((p,i)=>`<div>${i+1}</div><div class="rname">${p.name}</div><div>${p.correct}</div><div>${p.wrong}</div><div>${p.timeout}</div><div class="rscore">${p.score}</div>`).join("");
 return `<div class="rankGrid"><div class="rh">排名</div><div class="rh">玩家</div><div class="rh">答對</div><div class="rh">答錯</div><div class="rh">未作答</div><div class="rh">分數</div>${rows}</div>`
}
function openRankModal(ranking=room?.ranking||[]){
  $("modalBody").innerHTML=`<h2>🏆 排行榜</h2>${rankHtml(ranking)}`;$("modal").classList.remove("hidden")
}
function showResult(ranking=room?.ranking||[]){
  clearPhase();clearDrops();answered=true;
  if(room)room.status="ended";
  $("gameTime").textContent="🏁 已結束";$("qTime").textContent="遊戲結束";$("timerbar").style.width="0%";
  let idx=(ranking||[]).findIndex(x=>x.name===me?.name),rank=idx>=0?idx+1:"-";
  $("myResult").innerHTML=`<h3>🏁 遊戲結束！</h3><p>🏆 最終排名：第 ${rank} 名</p><p>答對 ${me?.correct||0}　答錯 ${me?.wrong||0}　未作答 ${me?.timeout||0}　⭐ ${me?.score||0} 分</p>`;
  $("result").classList.remove("hidden");
  let ov=$("gameEndOverlay");
  if(!ov){
    ov=document.createElement("div");ov.className="endOverlay";ov.id="gameEndOverlay";
    ov.innerHTML=`<div class="endCard"><div class="endTitle">🏁 遊戲結束！</div><div class="endStats">🏆 最終排名：第 ${rank} 名<br>答對 ${me?.correct||0}　答錯 ${me?.wrong||0}　未作答 ${me?.timeout||0}<br>⭐ ${me?.score||0} 分</div><button id="endRankBtn" class="btn">🏆 查看最終排行榜</button></div>`;
    $("game").appendChild(ov);$("endRankBtn").onclick=()=>openRankModal(ranking)
  }
}
$("showRank").onclick=()=>room&&alert(room.ranking.map((p,i)=>`第${i+1}名｜${p.name}｜${p.score}分`).join("\\n"));

</script></body></html>
